<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mic Monitor</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 40px auto;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 1rem;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Mic Monitor</h1>
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
    <div id="status">(stopped)</div>
    <div id="voiceList"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            async function refreshStatus() {
                const res = await fetch('/status');
                const data = await res.json();
                document.getElementById('status').textContent =
                    data.running ? '(running)' : '(stopped)';
            }

            document.getElementById('startBtn').addEventListener('click', async () => {
                await fetch('/start', { method: 'POST' });
                refreshStatus();
            });

            document.getElementById('stopBtn').addEventListener('click', async () => {
                await fetch('/stop', { method: 'POST' });
                refreshStatus();
            });

            async function renderVoiceList() {
                const res = await fetch('/voices');
                const data = await res.json();
                const voiceListEl = document.getElementById('voiceList');
                voiceListEl.innerHTML = '';

                data.voices.forEach((voice) => {
                    const optionBtn = document.createElement('button');
                    optionBtn.textContent = voice.name;
                    optionBtn.classList.add('voice-option');
                    optionBtn.dataset.voiceId = voice.id;
                    if (voice.id === data.activeVoiceId) {
                        optionBtn.classList.add('active');
                    }
                    optionBtn.addEventListener('click', async () => {
                        await fetch('/voices/select', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id: voice.id })
                        });
                        renderVoiceList();
                    });
                    voiceListEl.appendChild(optionBtn);
                });
            }

            // Initial status
            refreshStatus();
            renderVoiceList();

        });
    </script>
</body>
</html>
