<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mic Monitor</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 40px auto;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 1rem;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Mic Monitor</h1>
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
    <div id="status">(stopped)</div>
    <div>
        <input id="pitchSlider" type="range" min="-4.00" max="4.00" step = 0.1>
        <span id="pitchValue"></span>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const elements = {
                pitchSlider: document.getElementById("pitchSlider"),
                pitchValue: document.getElementById("pitchValue"),
            };

            pitchValue.textContent = (elements.pitchSlider.value)

            async function refreshStatus() {
                const res = await fetch('/status');
                const data = await res.json();
                document.getElementById('status').textContent =
                    data.running ? '(running)' : '(stopped)';
            }

            document.getElementById('startBtn').addEventListener('click', async () => {
                await fetch('/start', { method: 'POST' });
                refreshStatus();
            });

            document.getElementById('stopBtn').addEventListener('click', async () => {
                await fetch('/stop', { method: 'POST' });
                refreshStatus();
            });

            document.getElementById('pitchSlider').addEventListener('input', async () => {
                elements.pitchValue.textContent = (elements.pitchSlider.value)
            });

            // Initial status
            refreshStatus();

        });
    </script>
</body>
</html>
