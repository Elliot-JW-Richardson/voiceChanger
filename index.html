<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mic Monitor</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 40px auto;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 1rem;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
        }
        .voice-group-heading {
            margin: 20px 0 4px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #666;
        }
        #voiceListTest .voice-option {
            background: #fff3cd;
            border: 1px solid #e0c36a;
        }
    </style>
</head>
<body>
    <h1>Mic Monitor</h1>
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
    <div id="status">(stopped)</div>
    <div id="voiceList">
        <div class="voice-group-heading">Voices</div>
        <div id="voiceListFull"></div>
        <div id="testingHeading" class="voice-group-heading" style="display:none">Testing</div>
        <div id="voiceListTest"></div>
    </div>

    <div id="volumeControl">
        <label for="volumeSlider">Master Volume</label>
        <input type="range" id="volumeSlider" min="0" max="400" value="100">
    </div>

    <div id="noiseGateControl">
        <label for="noiseGateSlider">Noise Gate</label>
        <input type="range" id="noiseGateSlider" min="0" max="100" value="0">
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            async function refreshStatus() {
                const res = await fetch('/status');
                const data = await res.json();
                document.getElementById('status').textContent =
                    data.running ? '(running)' : '(stopped)';
            }

            document.getElementById('startBtn').addEventListener('click', async () => {
                await fetch('/start', { method: 'POST' });
                refreshStatus();
            });

            document.getElementById('stopBtn').addEventListener('click', async () => {
                await fetch('/stop', { method: 'POST' });
                refreshStatus();
            });

            async function renderVoiceList() {
                const res = await fetch('/voices');
                const data = await res.json();
                const fullListEl = document.getElementById('voiceListFull');
                const testListEl = document.getElementById('voiceListTest');
                const testingHeadingEl = document.getElementById('testingHeading');
                fullListEl.innerHTML = '';
                testListEl.innerHTML = '';

                data.voices.forEach((voice) => {
                    const optionBtn = document.createElement('button');
                    optionBtn.textContent = voice.name;
                    optionBtn.classList.add('voice-option');
                    optionBtn.dataset.voiceId = voice.id;
                    if (voice.id === data.activeVoiceId) {
                        optionBtn.classList.add('active');
                    }
                    optionBtn.addEventListener('click', async () => {
                        await fetch('/voices/select', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id: voice.id })
                        });
                        renderVoiceList();
                    });
                    // Clusters "Testing" (diagnostic/WIP) Voices separately
                    // from finished "Voices" so it's obvious which is which
                    // (see CONTEXT.md's "Diagnostic Voices" note).
                    if (voice.test) {
                        testListEl.appendChild(optionBtn);
                    } else {
                        fullListEl.appendChild(optionBtn);
                    }
                });

                testingHeadingEl.style.display = testListEl.children.length > 0 ? '' : 'none';
            }

            async function renderVolumeSlider() {
                const res = await fetch('/volume');
                const data = await res.json();
                document.getElementById('volumeSlider').value = data.level;
            }

            const volumeSlider = document.getElementById('volumeSlider');
            volumeSlider.addEventListener('change', async () => {
                const newLevel = parseInt(volumeSlider.value, 10);
                await fetch('/volume', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ level: newLevel })
                });
            });

            async function renderNoiseGateSlider() {
                const res = await fetch('/noise_gate');
                const data = await res.json();
                document.getElementById('noiseGateSlider').value = data.level;
            }

            const noiseGateSlider = document.getElementById('noiseGateSlider');
            noiseGateSlider.addEventListener('change', async () => {
                const newLevel = parseInt(noiseGateSlider.value, 10);
                await fetch('/noise_gate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ level: newLevel })
                });
            });

            // Initial status
            refreshStatus();
            renderVoiceList();
            renderVolumeSlider();
            renderNoiseGateSlider();

        });
    </script>
</body>
</html>
