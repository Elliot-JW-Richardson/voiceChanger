id: sawtooth_blend_wip
name: "Sawtooth Blend (WIP)"
default: false
# WORK-IN-PROGRESS Voice, not a finished character -- the first step of a
# possible Magos rebuild after real-hardware testing found the `vocoder`
# Effect Step (voices/magos.yaml's current chain) destroyed voice
# intelligibility entirely (it discards the input waveform and
# resynthesizes from scratch; see voice_engine/engine.py's
# CompileVocoderStep docstring). `sawtooth_blend` (see
# CompileSawtoothBlendStep's docstring) takes the opposite approach: it
# MIXES a pitch-tracked sawtooth into the voice instead of replacing the
# voice with one, so the original voice's clarity is never fully at risk.
#
# Deliberately no pitch_shift yet -- this is stage 1 of validating the
# new approach at the voice's natural register before layering the "deep"
# register on top, mirroring how the earlier vocoder-ordering bug was
# diagnosed one stage at a time (see CONTEXT.md's "Diagnostic Voices"
# note). Compare against Passthrough for a baseline.
#
# mix=0.2 is a starting point chosen from prototyping (see
# tests/test_sawtooth_blend_step.py's docstring for the underlying
# numbers): a mix around 0.1-0.2 keeps the sawtooth carrier from
# destructively interfering with the voice's own phase (both signals are
# summed in the time domain, and can partially cancel at similar
# frequencies -- prototyping found correlation with the original voice
# could even go negative above ~mix=0.3). Re-tune by ear.
chain:
  - type: sawtooth_blend
    mix: 0.2
