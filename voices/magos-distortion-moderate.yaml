id: magos_distortion_moderate
name: "TEST: Magos + Distortion (moderate)"
default: false
test: true
# A/B TEST VOICE -- investigating "sounds much better, but lacking
# richness" feedback on the retuned Magos (ADR 0005). Direct FFT
# harmonic-series comparison against reference audio confirmed this
# objectively: ring_mod alone only redistributes the voice's OWN
# existing harmonics, and a natural voice's higher harmonics are
# naturally weak, so Magos's harmonics beyond the 2nd measured
# noticeably quieter than the reference's own profile.
#
# This adds `distortion` (pedalboard.Distortion waveshaping -- generates
# real NEW harmonic content, unlike ring_mod/bitcrush) right after the
# pitch shift. drive_db=30 is a MODERATE setting from prototyping against
# real voice recordings -- meaningfully closer to the reference's
# harmonic profile than no distortion, without being pushed as hard as
# possible. Compare against `magos-distortion-aggressive.yaml` (drive_db
# higher) to judge which level actually sounds right -- the numbers said
# "closer," only your ears can say "better."
#
# `limiter` is REQUIRED at the end here, not optional -- distortion at
# this drive level leaves the signal near full scale, and the eq boost
# after it can push well past [-1.0, 1.0] otherwise (confirmed to reach
# ~2.5 peak without a limiter during testing). This does NOT get caught
# by Master Volume's own limiter, which is bypassed entirely at the
# default 100% level.
chain:
  - type: pitch_shift
    semitones: -14
  - type: distortion
    drive_db: 30
  - type: ring_mod
    frequency: 54
  - type: bitcrush
    bit_depth: 10
  - type: eq
    band: high
    cutoff_frequency_hz: 2500
    gain_db: 6
  - type: limiter
    threshold_db: -1.0
