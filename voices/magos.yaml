id: magos
name: Magos
default: false
# The flagship cosplay character Voice (see CONTEXT.md's Voice Bank and
# Deployment scope entries) -- a Warhammer 40K Magos-style robotic,
# distorted voice. Chains pitch shift, ring modulation, bitcrush, EQ,
# gain, and a limiter.
#
# HISTORY: originally pitch_shift(-10) + ring_mod(35Hz) + bitcrush(10)
# (Slice 22). Briefly replaced with a `vocoder` Effect Step (Slice 36),
# which real-hardware testing found destroyed intelligibility outright; a
# follow-up "mix a sawtooth into the voice" experiment (`sawtooth_blend`)
# also failed on real hardware. Both were removed and Magos reverted to
# the ring_mod design.
#
# LOUDNESS (this version): real-hardware measurement found the retuned
# chain below (pitch_shift/ring_mod/bitcrush/eq alone) was measurably
# too quiet -- roughly 12x quieter than reference audio of the target
# character. Chasing that full gap with `distortion` or a large `gain`
# (tried: drive_db up to 45, gain_db up to 32) introduced real, confirmed
# artifacts: `distortion` degraded pitch stability and amplified
# background noise; a large `gain` produced an audible rhythmic
# "ticking" and burst noise, traced to `pedalboard.Limiter`'s
# gain-reduction memory resetting every ~139ms block (this project's
# fixed per-block `reset=True` processing model -- see CLAUDE.md's
# Real-time performance notes -- doesn't carry a limiter's envelope
# state across blocks). DECISION: accept a smaller, clean gain boost
# here (`gain_db: 10`, chosen because 8-12dB all showed a similar,
# much-reduced boundary-artifact ratio versus 32dB's severe one, per
# testing) rather than chase full loudness parity at the cost of audible
# artifacts -- the user's live Master Volume slider already exists
# specifically to cover the remaining gap, live and adjustably, without
# needing this Voice's own chain to do all the work.
#
# RE-TUNED (this version) after properly analysing TWO independent
# reference sources -- the original song used for ADR 0004, re-examined
# more carefully, plus a second, unrelated spoken-word reference -- and,
# critically, testing candidate chains against actual recordings of the
# user's own voice rather than synthetic test tones (see
# reference_audio/, a local-only gitignored folder, not committed).
#
# KEY CORRECTION TO ADR 0004: the original analysis described the
# reference's fundamental as "moving with the melody." Re-analysis with
# a proper pitch tracker (librosa pYIN) across both references shows the
# fundamental is actually mostly FLAT at a low resting pitch (~45-58Hz),
# with brief rises at stressed syllables/phrase onsets before settling
# back down -- ordinary speech prosody pitched down onto a low register,
# not a moving melody. That's architecturally much closer to what a
# FIXED-frequency carrier (ring_mod) produces than what the vocoder
# (built for continuous per-block pitch TRACKING) was designed for --
# a real factor in why the vocoder rebuild was unnecessary complexity.
#
# METHOD: measured the reference's fundamental range (~45-58Hz median
# across both sources), then computed the pitch-shift depth needed to
# land the user's own natural speaking pitch (~121Hz median, measured
# from two separate recordings) into that range. Additionally found,
# via direct FFT analysis of a stable pitch region, that the reference's
# 2nd harmonic is LOUDER than its fundamental -- and confirmed, by
# testing against the user's real voice, that this happens naturally
# when ring_mod's carrier frequency is set equal to the shifted voice's
# own fundamental (multiplying a signal by a carrier at its own
# frequency pushes the fundamental's energy up into the 2nd harmonic).
# Verified the whole chain's output against the reference's measured
# profile (fundamental, spectral centroid, 85%-energy rolloff, 2nd-vs-
# 1st-harmonic ratio) across BOTH of the user's voice recordings before
# shipping this -- not just a single synthetic-tone sanity check, the
# mistake that led to the vocoder's undetected failure.
chain:
  # -14 semitones (deepened from -10): -10 only lands the user's ~121Hz
  # natural median pitch at ~68Hz, above the reference's measured
  # ~45-58Hz range entirely. -14 lands it at ~54Hz, inside that range --
  # verified against two separate recordings of the user's voice (54.4Hz
  # and 56.0Hz measured output fundamental respectively).
  - type: pitch_shift
    semitones: -14
  # 54 Hz (retuned from 35Hz): set equal to the TARGET fundamental
  # (~54Hz) rather than an arbitrary "robotic buzz" frequency. This is
  # the single biggest factor in matching the reference's measured
  # harmonic shape -- at 35Hz (unrelated to the shifted voice's own
  # ~54-68Hz fundamental) the old chain's ring_mod sidebands didn't
  # reinforce anything and left the pitch tracker reading a confused
  # ~34Hz beat artifact, nowhere near the target. At 54Hz, ring_mod's
  # multiply pushes the fundamental's energy up into the 2nd harmonic --
  # measured 2nd/1st harmonic energy ratio ~3.3-3.4 against the user's
  # real voice, matching the reference's own "2nd harmonic louder than
  # the fundamental" signature. If you ever change `semitones` above,
  # re-tune this to match your new expected output fundamental (roughly
  # `your natural median pitch * 2^(semitones/12)`), not a random value.
  - type: ring_mod
    frequency: 54
  # bit_depth 10: unchanged from the original chain (see git history) --
  # still keeps meaningful grit at full volume while staying intelligible
  # on realistic quiet mic input (pedalboard.Bitcrush quantizes in FIXED
  # steps across [-1, 1], not relative to signal amplitude -- see
  # CONTEXT.md's Effect palette entry).
  - type: bitcrush
    bit_depth: 10
  # High-shelf +6dB @2500Hz: the reference shows real broadband energy
  # up to ~5.7kHz (85%-energy rolloff) that pitch_shift+ring_mod+bitcrush
  # alone don't fully reach on real voice input (measured output rolloff
  # only ~4.7kHz without this step). This boost is what closed that gap
  # in testing (measured output rolloff ~6.0-6.8kHz with it) -- genuine
  # brightness/grit in the target's upper spectrum, not just a "make it
  # louder" EQ move. Lowering bitcrush's bit_depth further was tried
  # first and made things DARKER instead of brighter, the opposite of
  # what was needed -- worth remembering if re-tuning this again.
  - type: eq
    band: high
    cutoff_frequency_hz: 2500
    gain_db: 6
  # gain_db 10: a clean, modest loudness boost -- NOT an attempt to
  # match the reference's full measured loudness (that needed ~32dB and
  # produced real rhythmic-ticking/burst-noise artifacts in testing, see
  # this file's header comment). 8-12dB all measured similarly clean;
  # 10 is the middle of that range. Push further with the live Master
  # Volume slider, not by raising this value -- that's what it's for.
  - type: gain
    gain_db: 10
  # REQUIRED alongside `gain`, not optional: even a modest gain_db can
  # push real voice input's peaks past [-1.0, 1.0] on louder syllables,
  # and this is NOT caught by ApplyMasterVolume's own limiter downstream,
  # which is bypassed entirely at the default 100% Master Volume level
  # (see CompileGainStep's docstring in voice_engine/engine.py).
  - type: limiter
    threshold_db: -1.0
