id: magos
name: Magos
default: false
# The flagship cosplay character Voice (see CONTEXT.md's Voice Bank and
# Deployment scope entries) -- a Warhammer 40K Magos-style robotic,
# distorted voice. Chains pitch shift, ring modulation, and bitcrush, per
# CONTEXT.md's example dialogue: "Chain a pitch shift with ring modulation
# and some distortion -- those are just more Effect Steps in the same
# list."
#
# REVERTED from a vocoder-based chain (Slice 36) back to this known-good
# ring_mod design: real-hardware testing found the vocoder Effect Step
# destroyed voice intelligibility outright (it discards the input's own
# waveform and resynthesizes from a detected pitch plus a coarse 4-band
# envelope -- see voice_engine/engine.py's CompileVocoderStep docstring),
# and a follow-up "mix a sawtooth into the voice instead" experiment
# (sawtooth_blend) was tried and also failed on real hardware (extremely
# loud output, no audible speech). Both attempts are removed rather than
# left half-working. This chain is the last version confirmed to actually
# sound like a voice; the vocoder/electronic-texture idea is on hold
# pending a more careful analysis of the original reference track (see
# ADR 0004) before trying again.
chain:
  # -10 semitones: noticeably deeper/more extreme than Deep Voice's -6, so
  # Magos reads as a distinct, more inhuman register rather than just a
  # louder version of Deep.
  - type: pitch_shift
    semitones: -10
  # 35 Hz: in the tens-of-Hz range this project's ring-mod tests use for a
  # metallic/robotic buzz (see tests/test_ring_mod_step.py) -- audible as
  # texture on top of the voice without turning it into pure noise.
  - type: ring_mod
    frequency: 35
  # bit_depth 10 (raised from an initial 5 -- see git history and
  # CONTEXT.md's Effect palette entry): pedalboard.Bitcrush quantizes in
  # FIXED steps across the full [-1, 1] range, not relative to the actual
  # signal's amplitude. bit_depth 5 sounded fine against a full-scale test
  # tone but collapsed real (quiet) microphone input to only 3-4 distinct
  # values total -- heard as buzzy squeaks, not a voice. 10 keeps
  # meaningful grit at full volume while staying intelligible at realistic
  # quiet input levels. Re-tune by ear if your mic input level changes
  # (e.g. after adjusting OS/hardware input gain).
  - type: bitcrush
    bit_depth: 10
