id: magos_distortion_aggressive
name: "TEST: Magos + Distortion (aggressive)"
default: false
test: true
# A/B TEST VOICE -- see magos-distortion-moderate.yaml's header comment
# for the full context (investigating "lacking richness" feedback on
# the retuned Magos, ADR 0005).
#
# Same chain as magos-distortion-moderate.yaml, but drive_db=45 --
# prototyping found harmonics kept getting measurably closer to the
# reference's profile with more drive, at least up to the range tested,
# though with diminishing returns. This is the "push it harder" end of
# the comparison -- listen for whether it still sounds like a voice at
# this level, or starts breaking down/turning into pure noise.
chain:
  - type: pitch_shift
    semitones: -14
  - type: distortion
    drive_db: 45
  - type: ring_mod
    frequency: 54
  - type: bitcrush
    bit_depth: 10
  - type: eq
    band: high
    cutoff_frequency_hz: 2500
    gain_db: 6
  - type: limiter
    threshold_db: -1.0
