id: debug-vocoder-only
name: "DEBUG: Vocoder Only"
default: false
# DIAGNOSTIC VOICE -- temporary, part of a one-off real-hardware audition
# round investigating "I can hear *something* but there's no detectable
# voice" on Magos after the vocoder-ordering fix (commit 56de4af) resolved
# the earlier squeaking. DELETE once the diagnosis is complete -- this
# hand-duplicates the first step of magos.yaml's chain and will silently
# go stale if that chain changes again.
#
# Isolates STAGE 1 of Magos's chain: vocoder ALONE, at the voice's natural
# (unshifted) register, nothing downstream to mask or further damage its
# output. Compare against Passthrough (raw mic) immediately before this,
# so the ear has a fresh baseline.
chain:
  - type: vocoder
